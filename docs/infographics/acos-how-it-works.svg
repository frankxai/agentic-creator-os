<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How ACOS works</title>
<desc id="d">Flow from the operator through their harness to the /acos router, then commands, skills, agent profiles and safety hooks, ending in files the operator reviews.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="640" fill="#0a0a0b"/>
<rect x="20" y="20" width="1160" height="600" rx="20" fill="#0a0a0b" stroke="rgba(255,255,255,.18)"/>
<text x="50" y="64" font-size="26" font-weight="600" fill="#f4f4f5">How ACOS works</text>
<text x="50" y="90" font-size="15" fill="#a1a1aa">A request moves through plain files in your harness. You review what comes out.</text>
<path d="M254 205 H344" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<path d="M554 205 H644" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<path d="M854 205 H944" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<path d="M1050 294 V374" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<path d="M946 465 H856" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<path d="M646 465 H556" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<path d="M346 465 H256" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/>
<rect x="50" y="120" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="66" y="150" font-size="12" fill="#34d399" font-weight="600">1</text>
<text x="66" y="176" font-size="19" fill="#f4f4f5" font-weight="600">You, the operator</text>
<text x="66" y="204" font-size="14" fill="#a1a1aa">Describe the task in</text>
<text x="66" y="225" font-size="14" fill="#a1a1aa">one sentence, or run</text>
<text x="66" y="246" font-size="14" fill="#a1a1aa">a command.</text>
<rect x="350" y="120" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="366" y="150" font-size="12" fill="#67e8f9" font-weight="600">2</text>
<text x="366" y="176" font-size="19" fill="#f4f4f5" font-weight="600">Your harness</text>
<text x="366" y="204" font-size="14" fill="#a1a1aa">Claude Code, Cursor,</text>
<text x="366" y="225" font-size="14" fill="#a1a1aa">Windsurf, Gemini CLI,</text>
<text x="366" y="246" font-size="14" fill="#a1a1aa">Grok, Antigravity,</text>
<text x="366" y="267" font-size="14" fill="#a1a1aa">generic</text>
<rect x="650" y="120" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="666" y="150" font-size="12" fill="#34d399" font-weight="600">3</text>
<text x="666" y="176" font-size="19" fill="#f4f4f5" font-weight="600">/acos router</text>
<text x="666" y="204" font-size="14" fill="#a1a1aa">.claude/commands/</text>
<text x="666" y="225" font-size="14" fill="#a1a1aa">acos.md picks the</text>
<text x="666" y="246" font-size="14" fill="#a1a1aa">command to run.</text>
<rect x="950" y="120" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="966" y="150" font-size="12" fill="#67e8f9" font-weight="600">4</text>
<text x="966" y="176" font-size="19" fill="#f4f4f5" font-weight="600">Commands</text>
<text x="966" y="204" font-size="14" fill="#a1a1aa">.claude/commands/</text>
<text x="966" y="225" font-size="14" fill="#a1a1aa">Each one is a written</text>
<text x="966" y="246" font-size="14" fill="#a1a1aa">workflow.</text>
<rect x="950" y="380" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="966" y="410" font-size="12" fill="#34d399" font-weight="600">5</text>
<text x="966" y="436" font-size="19" fill="#f4f4f5" font-weight="600">Skills</text>
<text x="966" y="464" font-size="14" fill="#a1a1aa">.claude/skills/</text>
<text x="966" y="485" font-size="14" fill="#a1a1aa">Chosen by activation</text>
<text x="966" y="506" font-size="14" fill="#a1a1aa">rules in .claude/</text>
<text x="966" y="527" font-size="14" fill="#a1a1aa">skill-rules.json.</text>
<rect x="650" y="380" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="666" y="410" font-size="12" fill="#67e8f9" font-weight="600">6</text>
<text x="666" y="436" font-size="19" fill="#f4f4f5" font-weight="600">Agent profiles</text>
<text x="666" y="464" font-size="14" fill="#a1a1aa">.claude/agents/</text>
<text x="666" y="485" font-size="14" fill="#a1a1aa">Specialist roles a</text>
<text x="666" y="506" font-size="14" fill="#a1a1aa">command can hand</text>
<text x="666" y="527" font-size="14" fill="#a1a1aa">work to.</text>
<rect x="350" y="380" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="366" y="410" font-size="12" fill="#34d399" font-weight="600">7</text>
<text x="366" y="436" font-size="19" fill="#f4f4f5" font-weight="600">Safety hooks</text>
<text x="366" y="464" font-size="14" fill="#a1a1aa">Circuit breaker, audit</text>
<text x="366" y="485" font-size="14" fill="#a1a1aa">trail, self-modify</text>
<text x="366" y="506" font-size="14" fill="#a1a1aa">gate, agent IAM</text>
<text x="366" y="527" font-size="14" fill="#a1a1aa">(.claude/agent-iam.json)</text>
<rect x="50" y="380" width="200" height="170" rx="12" fill="#111114" stroke="rgba(255,255,255,.18)"/>
<text x="66" y="410" font-size="12" fill="#67e8f9" font-weight="600">8</text>
<text x="66" y="436" font-size="19" fill="#f4f4f5" font-weight="600">Outputs</text>
<text x="66" y="464" font-size="14" fill="#a1a1aa">Files and diffs in</text>
<text x="66" y="485" font-size="14" fill="#a1a1aa">your project.</text>
<text x="66" y="506" font-size="14" fill="#a1a1aa">You review them.</text>
<text x="50" y="598" font-size="13" fill="#a1a1aa">Whether a skill activates, a command is available, or a hook runs depends on your harness and its local configuration.</text>
</svg>
