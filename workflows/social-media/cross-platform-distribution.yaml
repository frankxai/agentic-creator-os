name: GenCreator cross-platform distribution
slug: cross-platform-distribution
version: "3.0.0"
description: >
  Turn an explicitly selected permitted source into complete audience-specific
  drafts, exact-revision checks and a recoverable unsent edition. ACOS routes
  reusable methods; GenCreator owns creation, review and learning.
triggers:
  - /generate-social
  - create a social edition
ownership:
  coordinator: existing GenCreator Companion or the active local host
  source_voice_and_canon: existing CreatorPack revision
  portable_methods: frankxai/gencreator-skills/video-social-studio
  local_review: installed gencreator-native/gencreator-produce
  publishing: one explicitly designated destination workflow per brand
tools:
  - explicitly selected local Producer script and reviewed SHA-256
  - tools/gencreator-social/packet.mjs
phases:
  - name: Source and strategy
    steps:
      - Read the selected source, rights, audience, objective and CreatorPack policies.
      - Index exact source spans; preserve source digest and existing artifact IDs.
      - Select useful channels and account-specific experiments; label unknowns.
      - Load content-calendar, social-post-kit and platform-specs only as needed.
  - name: Complete creation
    steps:
      - Author finished post copy, slide text, newsletter or video script as requested.
      - Use shorts-from-long and video modules only for an actual clipping or video job.
      - Review voice, factual support, usefulness, rights and current format constraints.
      - Label copy, render requests, rendered media and exports according to actual receipts.
  - name: Local review and recovery
    steps:
      - Save a source-linked local edition with empty confirmations on the first run.
      - Run the pinned Producer through packet prepare into a fresh directory.
      - Run packet verify and inspect the finished editable content.
      - Preserve incomplete packets; correct the input and retry into a new directory.
      - After a real creator decision, re-review the exact confirmed revision separately.
  - name: Authorized delivery
    steps:
      - Prepare an unsent destination-specific handoff with media and schedule gaps.
      - Verify destination account, current API constraints and explicit publishing approval.
      - Execute only through the designated publisher and preserve its actual response.
      - Record pending, sent and verified publication separately; prevent duplicate sends.
  - name: Observed learning
    steps:
      - Import supplied or authorized analytics with metric definitions and observation windows.
      - Use GenCreator performance analysis; keep absent values unknown.
      - Propose one comparable account-specific experiment and one evidence-linked lesson.
      - Obtain creator acceptance before a CreatorPack update or community sharing.
output_dir: creator-selected private destination
outputs:
  - source.txt
  - edition.json
  - review.json
  - content.md
  - receipt.json
acceptance:
  - Complete editable copy inspected for the selected audience and source.
  - Exact Producer revision recorded and packet integrity verified.
  - Review, media, identity and publication gaps reported separately.
  - No universal ranking guarantee or invented observation.
