name: ACOS Health Check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/hooks/**'
      - '.claude/skills/**'
      - '.claude/skill-rules.json'
      - '.claude-plugin/plugin.json'
      - '.github/workflows/acos-health-check.yml'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'QUICKSTART.md'
      - 'README.md'
      - 'install.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-public-surface.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify public claims and isolated install
        run: node scripts/verify-public-surface.mjs

      - name: Validate installer syntax
        run: bash -n install.sh

      - name: Validate skill modules
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r -d '' skill; do
            if [ ! -s "$skill" ]; then
              echo "Empty skill module: $skill"
              failures=$((failures + 1))
            fi
          done < <(find .claude/skills -name 'SKILL.md' -type f -print0)
          test "$failures" -eq 0

      - name: Validate shell hook syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' hook; do
            bash -n "$hook"
          done < <(find .claude/hooks -name '*.sh' -type f -print0)
